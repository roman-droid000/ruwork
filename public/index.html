<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="RUWORK — маркетплейс фриланс-услуг: оплата через СБП">
<meta name="theme-color" content="#0B0C10">
<title>RUWORK — маркетплейс фриланс-услуг</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>:root{--void:#0E1013;--surface:#151820;--surface2:#1A1E27;--glass:#151820;--cy:#6AA9FF;--ma:#6AA9FF;--gr:#58C08A;--tx:#E6E8EC;--mu:#8B93A1;--ln:#232832;--ln2:#303644;
--f1:Inter,system-ui,"Segoe UI",sans-serif;--f2:Inter,system-ui,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--tx);font:400 16px/1.5 var(--f2)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(60% 45% at 50% 0,rgba(207,92,255,.16),transparent 70%),radial-gradient(40% 35% at 95% 15%,rgba(0,255,255,.12),transparent 70%),linear-gradient(rgba(0,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(207,92,255,.12) 1px,transparent 1px);background-size:auto,auto,48px 48px,48px 48px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
::selection{background:var(--cy);color:#0b1020}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}img{max-width:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(14,16,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
header .wrap{display:flex;align-items:center;gap:22px;height:60px}
.logo{font:700 20px var(--f1);letter-spacing:.04em;color:transparent}
.lg1,.lgo,.lg3{-webkit-background-clip:text;background-clip:text;color:transparent}
.lg1{background-image:linear-gradient(90deg,#FFFFFF 0%,#F1E8FF 100%)}
.lgo{background-image:linear-gradient(90deg,#F1E8FF 0%,#C9A0FF 100%)}
.lg3{background-image:linear-gradient(90deg,#C9A0FF 0%,#9A3DFF 100%)}
nav{display:flex;gap:6px;margin-left:auto;align-items:center}
nav a{color:var(--mu);padding:7px 12px;border-radius:8px;font-weight:500;font-size:15px;transition:color .15s,background .15s}
nav a:hover,nav a.on{color:var(--tx);background:var(--surface2)}
.badge{background:var(--cy);color:#0b1020;border-radius:99px;padding:0 7px;font-size:12px;font-weight:700;margin-left:6px}
.glass{background:var(--surface);border:1px solid var(--ln);border-radius:12px}
.btn{min-height:42px;font:500 15px var(--f2);cursor:pointer;border:1px solid var(--ln2);color:var(--tx);background:var(--surface2);padding:9px 18px;border-radius:8px;transition:border-color .15s,background .15s,filter .15s;display:inline-block;text-align:center}
.btn:hover{border-color:#47506a;background:#212633}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.m{background:var(--cy);border-color:var(--cy);color:#0b1020;font-weight:600}
.btn.m:hover{filter:brightness(1.08);background:var(--cy)}
.btn.g{background:transparent;border-color:rgba(88,192,138,.6);color:var(--gr)}
.btn.g:hover{background:rgba(88,192,138,.12);border-color:var(--gr)}
.btn.s{padding:4px 12px;min-height:34px;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px;border:1px solid var(--ln2);color:var(--mu)}
.tag.c{color:#8DBBFF;border-color:rgba(106,169,255,.35);background:rgba(106,169,255,.08)}
.tag.m{color:#E0B04A;border-color:rgba(224,176,74,.35);background:rgba(224,176,74,.08)}
.tag.g{color:var(--gr);border-color:rgba(88,192,138,.35);background:rgba(88,192,138,.08)}
.hero{text-align:left;margin-top:24px;padding:clamp(24px,4vw,48px);border:1px solid var(--ln);border-radius:14px;background:var(--surface)}
.hero h1{display:inline-block;max-width:100%;font:700 clamp(40px,8vw,76px)/1 var(--f1);margin:0;letter-spacing:.02em;color:transparent}
.hero p{color:var(--mu);font-size:18px;margin:14px 0 22px}
.hero .search{margin:0}
.search{display:flex;max-width:620px;margin:0 auto;gap:8px}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{flex:1;background:#0F1217;border:1px solid var(--ln2);color:var(--tx);border-radius:8px;padding:11px 14px;font:400 16px var(--f2)}
input[type=text]:focus,input[type=number]:focus,input[type=email]:focus,input[type=password]:focus,select:focus,textarea:focus{border-color:var(--cy);outline:none}
select{flex:0}
h2{font:600 20px var(--f1);margin:40px 0 16px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cat{display:block;padding:18px 16px;font:500 16px/1.35 var(--f2);transition:border-color .15s,background .15s}
.cat:hover{border-color:var(--cy);background:var(--surface2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gig{display:block;overflow:hidden;transition:border-color .15s,transform .15s}
.gig:hover{border-color:#3c4556;transform:translateY(-2px)}
.cover{height:130px;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--surface2);border-bottom:1px solid var(--ln)}
.cover svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .3s}
.gig:hover .cover svg{transform:scale(1.04)}
.cover .tag{position:absolute;top:10px;left:10px;z-index:1;background:rgba(14,16,19,.78);color:var(--tx);border-color:var(--ln2)}
.top{position:absolute;top:10px;right:10px;z-index:1;background:var(--cy);color:#0b1020;font-weight:700;font-size:11px;padding:2px 8px;border-radius:6px}
.pad{padding:14px}
.gig h3{font:600 16px/1.35 var(--f2);margin:8px 0;height:44px;overflow:hidden}
.sel{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:14px}
.av{width:26px;height:26px;border-radius:50%;flex:none}
.price{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;border-top:1px solid var(--ln);padding-top:10px}
.price b{font:600 17px var(--f1);color:var(--tx)}.price small{color:var(--mu)}
.star{color:#E0B04A}
.layout{display:grid;grid-template-columns:250px 1fr;gap:22px;margin-top:26px}
.filters{padding:18px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto}.fbtn{display:none;width:100%;margin-bottom:12px}
.filters label{display:block;padding:4px 0;cursor:pointer}
.filters h4{margin:18px 0 6px;color:var(--mu);font:600 12px var(--f1);letter-spacing:.06em}
.filters h4:first-child{margin-top:0}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;margin-top:26px}
.tiers{display:flex;gap:6px;margin-bottom:14px}
.tiers button{flex:1;cursor:pointer;font:500 15px var(--f2);padding:9px;border-radius:8px;border:1px solid var(--ln2);background:none;color:var(--mu);transition:border-color .15s,color .15s}
.tiers button:hover{color:var(--tx)}
.tiers button.on{border-color:var(--cy);color:var(--cy);background:rgba(106,169,255,.1)}
.p{padding:20px}
ul.ft{list-style:none;padding:0;margin:12px 0}ul.ft li{padding:2px 0}ul.ft li::before{content:"✓ ";color:var(--gr)}
.rev{border-top:1px solid var(--ln);padding:12px 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;font-size:14px;color:var(--tx);background:#0F1217;padding:12px;border-radius:8px;border:1px dashed var(--ln2)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.pay{display:flex;gap:10px;margin-bottom:16px}.pay button{flex:1}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi .p b{display:block;font:600 26px var(--f1);margin-top:4px}
table{width:100%;min-width:520px;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:500;font-size:14px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--ln2);color:var(--tx);padding:12px 22px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:40}
footer{color:var(--mu);text-align:center;padding:50px 0 30px;font-size:14px}
.tbl{overflow-x:auto}
.chat{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{max-width:88%;padding:9px 13px;border-radius:10px;background:var(--surface2);border:1px solid var(--ln);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:rgba(106,169,255,.12);border-color:rgba(106,169,255,.35)}
.msg small{display:block;color:var(--mu);font-size:12px}
tr.new td{background:rgba(88,192,138,.07)}
.msg.sys{align-self:center;max-width:94%;text-align:center;font-size:14px;color:var(--gr);background:rgba(88,192,138,.08);border-color:rgba(88,192,138,.35)}
.cwh{display:flex;gap:12px;align-items:center;margin-bottom:12px}.cwh .cover{width:96px;height:64px;flex:none;border:1px solid var(--ln);border-radius:10px}.cwh h2{margin:0;font-size:18px;line-height:1.25}.cwh small{color:var(--mu)}
.mbox .chat{max-height:min(46vh,380px)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,6,8,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto}
.mbox{width:100%;max-width:640px;background:#12151B;border-color:var(--ln2);box-shadow:0 24px 60px rgba(0,0,0,.55);max-height:100%;overflow:auto}
.x{min-width:42px;min-height:42px;cursor:pointer;background:none;border:1px solid var(--ln2);color:var(--tx);border-radius:8px;font-size:16px}.x:hover{border-color:var(--cy);color:var(--cy)}
.demo{margin:0;padding:8px 12px;border-radius:8px;border:1px dashed rgba(224,176,74,.5);color:#D9B650;font-size:14px}
@media(min-width:1500px){.wrap{max-width:1560px}.grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}body{font-size:17px}.cover{height:150px}}
@media(max-width:1024px){.layout{grid-template-columns:210px 1fr;gap:16px}.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
@media(max-width:820px){.layout,.two{grid-template-columns:1fr}.filters{position:static;max-height:none;display:none}.filters.open{display:block}.fbtn{display:block}.hero{padding:26px 18px}h2{font-size:18px;margin:30px 0 12px}.filters label{padding:9px 0}.row{flex-wrap:wrap}}
@media(max-width:600px){header .wrap{height:auto;min-height:54px;flex-wrap:wrap;padding-top:8px;padding-bottom:6px;gap:4px 12px}.logo{font-size:19px}nav{width:100%;margin:0;justify-content:space-between;gap:4px}nav a{flex:1;text-align:center;padding:8px 4px}
.hero p{font-size:16px}.search{flex-direction:column}.search .btn{width:100%}.cats{grid-template-columns:repeat(2,1fr);gap:10px}.cat{padding:14px 12px;font-size:15px}
.grid{grid-template-columns:repeat(2,1fr);gap:10px}.cover{height:96px}.pad{padding:10px}.gig h3{font-size:15px;height:40px}.price b{font-size:14px}.price small{font-size:12px}.sel{font-size:13px;flex-wrap:wrap}.av{width:22px;height:22px}
.p{padding:14px}.pay{flex-direction:column}.kpi .p b{font-size:22px}.toast{width:calc(100% - 28px);text-align:center}footer{padding:34px 0 24px}}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
@media(hover:none){.gig:hover,.cat:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Юридические документы */
.plink{color:#A64DFF;font-size:12px;text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.plink:hover{color:#CF5CFF;text-decoration:underline}
.legal{max-width:720px;width:100%}
.ltabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.lt{cursor:pointer;background:none;border:1px solid var(--ln2);color:var(--mu);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px}
.lt.on{color:var(--tx);border-color:#A64DFF}
.lbody{max-height:60vh;overflow:auto;padding-right:6px}
.lbody h3{font-size:15px;margin:16px 0 4px}.lbody p{margin:0;color:var(--mu);font-size:14px;line-height:1.55}

/* ===== Плавный неон ===== */
:root{--void:#0A0A14;--surface:rgba(22,19,40,.78);--surface2:rgba(34,28,62,.7);--cy:#6FE3FF;--ma:#B57BFF;--vi:#A66BFF;--gr:#5EEAB0;--tx:#EEEAFB;--mu:#A39FBF;--ln:rgba(166,107,255,.22);--ln2:rgba(166,107,255,.34);--glowv:0 0 18px rgba(166,107,255,.28);--glowc:0 0 18px rgba(111,227,255,.28)}
body{background:var(--void)}
body::before{background-image:radial-gradient(60% 45% at 50% 0,rgba(166,107,255,.24),transparent 72%),radial-gradient(45% 40% at 100% 20%,rgba(111,227,255,.14),transparent 72%),radial-gradient(40% 40% at 0 80%,rgba(166,107,255,.12),transparent 72%),linear-gradient(rgba(166,107,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(111,227,255,.06) 1px,transparent 1px);background-size:auto,auto,auto,48px 48px,48px 48px}
header{background:rgba(10,10,20,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);box-shadow:0 1px 24px rgba(166,107,255,.14)}
.logo{filter:drop-shadow(0 0 8px rgba(166,107,255,.55))}
.hero h1{filter:drop-shadow(0 0 14px rgba(166,107,255,.5))}
nav a{border-radius:99px;transition:all .25s ease}
nav a:hover,nav a.on{background:rgba(166,107,255,.16);color:#fff;box-shadow:var(--glowv)}
.badge{background:linear-gradient(135deg,var(--vi),var(--cy));color:#0A0A14}
.glass{background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.02);transition:border-color .3s ease,box-shadow .3s ease,transform .3s ease}
.hero{border-radius:24px;background:linear-gradient(135deg,rgba(40,28,78,.7),rgba(18,20,42,.7));border-color:var(--ln2);box-shadow:0 0 40px rgba(166,107,255,.16),0 12px 40px rgba(0,0,0,.4)}
.btn{border-radius:99px;background:rgba(166,107,255,.1);border-color:var(--ln2);transition:all .25s ease}
.btn:hover{background:rgba(166,107,255,.2);border-color:var(--vi);box-shadow:var(--glowv)}
.btn.m{background:linear-gradient(135deg,#A66BFF,#6FE3FF);border:0;color:#0A0A14;font-weight:600;box-shadow:0 0 20px rgba(166,107,255,.4)}
.btn.m:hover{filter:brightness(1.1);box-shadow:0 0 28px rgba(111,227,255,.45);background:linear-gradient(135deg,#A66BFF,#6FE3FF)}
.btn.g{border-color:rgba(94,234,176,.55);color:var(--gr)}
.btn.g:hover{background:rgba(94,234,176,.12);box-shadow:0 0 18px rgba(94,234,176,.3)}
.tag{border-radius:99px}
.tag.c{color:#8FEBFF;border-color:rgba(111,227,255,.4);background:rgba(111,227,255,.08)}
.tag.m{color:#D7B8FF;border-color:rgba(166,107,255,.45);background:rgba(166,107,255,.12)}
.top{background:linear-gradient(135deg,#A66BFF,#6FE3FF);color:#0A0A14;border-radius:99px}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{background:rgba(10,10,22,.7);border-radius:12px;border-color:var(--ln2);transition:border-color .25s,box-shadow .25s}
input[type=text]:focus,input[type=number]:focus,input[type=email]:focus,input[type=password]:focus,select:focus,textarea:focus{border-color:var(--vi);box-shadow:0 0 0 3px rgba(166,107,255,.2),var(--glowv)}
.cat{transition:all .3s ease}
.cat:hover{border-color:var(--vi);background:rgba(166,107,255,.14);box-shadow:var(--glowv);transform:translateY(-2px)}
.gig{transition:all .3s ease}
.gig:hover{border-color:var(--vi);box-shadow:0 0 26px rgba(166,107,255,.3),0 12px 30px rgba(0,0,0,.4);transform:translateY(-4px)}
.cover{border-bottom:1px solid var(--ln);background:rgba(10,10,22,.6)}
.tiers button{border-radius:99px;transition:all .25s ease}
.tiers button.on{border-color:var(--vi);color:#fff;background:rgba(166,107,255,.2);box-shadow:var(--glowv)}
.msg{border-radius:16px}.msg.me{background:rgba(166,107,255,.18);border-color:rgba(166,107,255,.45)}
.mbox{background:rgba(18,15,36,.95);border-color:var(--ln2);border-radius:22px;box-shadow:0 0 50px rgba(166,107,255,.22),0 24px 60px rgba(0,0,0,.6)}
.modal{background:rgba(5,4,14,.72)}
.x{border-radius:99px}.x:hover{border-color:var(--vi);color:#fff;box-shadow:var(--glowv)}
.toast{border-radius:99px;background:rgba(30,24,56,.95);border-color:var(--vi);box-shadow:var(--glowv),0 8px 30px rgba(0,0,0,.5)}
.mono{background:rgba(10,10,22,.7);border-radius:12px;border-color:var(--ln2)}
.lt{border-radius:99px}.lt.on{border-color:var(--vi);box-shadow:var(--glowv)}
.star{color:#FFD27A}
:focus-visible{outline-color:var(--cy)}
::selection{background:var(--vi);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.cbtns{display:flex;gap:8px;margin-top:10px}.cbtns .btn{flex:1;padding:4px 8px}
#cc.bump{animation:bump .4s ease}@keyframes bump{50%{transform:scale(1.35)}}
.dsc{border-top:1px solid var(--ln);margin:14px 0;padding-top:4px}.dsc h3{font:600 16px var(--f1);margin:14px 0 6px}.dsc p{margin:0;color:var(--mu);line-height:1.6}.dsc .ft{margin:4px 0}
.sbox{position:relative;flex:1;display:flex}.sbox input{width:100%}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:rgba(20,16,38,.98);border:1px solid var(--ln2);border-radius:14px;box-shadow:0 0 24px rgba(166,107,255,.22),0 14px 40px rgba(0,0,0,.55);overflow:hidden;max-height:min(420px,60vh);overflow-y:auto}
.si{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:10px 14px;cursor:pointer;font-size:15px;border-bottom:1px solid rgba(166,107,255,.1)}
.si:last-child{border-bottom:0}.si small{color:var(--mu);white-space:nowrap;font-size:13px}
.si:hover,.si.on{background:rgba(166,107,255,.16)}
.si mark{background:none;color:#D7B8FF;font-weight:600}
.si.all{color:var(--cy);font-size:14px}.si.none{color:var(--mu);cursor:default}
@media(max-width:600px){.si{flex-direction:column;gap:2px}.si small{white-space:normal}}
.hero{position:relative;z-index:6}.sug{background:#151127}

/* ===== Матовое стекло (glassmorphism) ===== */
:root{--gl:rgba(255,255,255,.065);--gl2:rgba(255,255,255,.1);--glb:rgba(255,255,255,.14);--glb2:rgba(255,255,255,.24);--blur:blur(20px) saturate(160%);--ln:rgba(255,255,255,.1);--ln2:rgba(255,255,255,.18)}
body{background:#07060F}
body::before{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
body::after{content:"";position:fixed;inset:-10%;z-index:-2;pointer-events:none;filter:blur(70px);opacity:.85;
background:radial-gradient(28% 32% at 18% 22%,#7B3DFF 0,transparent 70%),radial-gradient(26% 30% at 82% 18%,#00C8FF 0,transparent 70%),radial-gradient(30% 34% at 70% 78%,#C23DFF 0,transparent 72%),radial-gradient(24% 28% at 22% 82%,#2E6BFF 0,transparent 72%);animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.06)}}
header{background:rgba(12,10,24,.38);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--glb);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.035));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glb);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.03),0 10px 34px rgba(0,0,0,.32)}
.hero{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glb2);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 20px 60px rgba(0,0,0,.35)}
.gig:hover,.cat:hover{background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05));border-color:var(--glb2);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 26px rgba(166,107,255,.28),0 14px 36px rgba(0,0,0,.4)}
.cover{background:rgba(255,255,255,.03);border-bottom:1px solid var(--glb)}
.cover .tag{background:rgba(10,8,22,.45);backdrop-filter:blur(8px);border-color:var(--glb)}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--glb);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn:hover{background:rgba(255,255,255,.15);border-color:var(--glb2)}
.btn.m{background:linear-gradient(135deg,rgba(166,107,255,.9),rgba(111,227,255,.85));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 20px rgba(166,107,255,.35)}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{background:rgba(255,255,255,.06);border:1px solid var(--glb);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
select option{background:#151127}
nav a:hover,nav a.on{background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.tiers button{background:rgba(255,255,255,.05);border-color:var(--glb)}
.tiers button.on{background:rgba(166,107,255,.22);border-color:rgba(200,160,255,.5)}
.modal{background:rgba(6,5,14,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mbox{background:linear-gradient(145deg,rgba(40,32,70,.72),rgba(20,16,40,.72));backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid var(--glb2);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 30px 80px rgba(0,0,0,.55)}
.sug{background:rgba(24,18,46,.78);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--glb2)}
.toast{background:rgba(30,24,56,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:var(--glb2)}
.msg{background:rgba(255,255,255,.06);border-color:var(--glb)}.msg.me{background:rgba(166,107,255,.2);border-color:rgba(200,160,255,.35)}
.mono{background:rgba(255,255,255,.05);border-color:var(--glb2)}
.price,.row,.rev,.dsc,td,th{border-color:var(--ln)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.hero,header,.mbox,.sug{background:rgba(22,18,42,.92)}}
@media(prefers-reduced-motion:reduce){body::after{animation:none}}
@media(max-width:600px){body::after{filter:blur(50px)}}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.55)}.tiers button{color:rgba(255,255,255,.78)}.tiers button.on{color:#fff}

/* ===== Рабочий стиль: жидкое стекло без пятен ===== */
body{background:#0B0B12}
body::after{content:none;animation:none}
body::before{background-image:linear-gradient(rgba(166,107,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(111,227,255,.04) 1px,transparent 1px);background-size:48px 48px}
header{background:rgba(14,14,22,.6);box-shadow:none}
.logo{filter:none}.hero h1{filter:none}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.09);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 20px rgba(0,0,0,.25)}
.hero{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.3)}
.gig:hover,.cat:hover{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border-color:rgba(166,107,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.35);transform:translateY(-2px)}
.btn{border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.btn.m{background:#8B5CF6;border:1px solid #9D74F8;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.m:hover{background:#9A6BFA;filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.btn.g{box-shadow:none}.btn.g:hover{box-shadow:none}
nav a{border-radius:8px}nav a:hover,nav a.on{box-shadow:none;background:rgba(255,255,255,.07)}
.tiers button{border-radius:8px}.tiers button.on{box-shadow:none;background:rgba(139,92,246,.2);border-color:rgba(157,116,248,.6)}
.tag{border-radius:6px}.top{border-radius:6px;background:#8B5CF6;color:#fff}.badge{background:#8B5CF6;color:#fff}
.x{border-radius:8px}.x:hover{box-shadow:none}
.lt{border-radius:8px}.lt.on{box-shadow:none}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{border-radius:10px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1)}
input:focus,select:focus,textarea:focus{border-color:rgba(157,116,248,.7)!important;box-shadow:0 0 0 3px rgba(139,92,246,.18)!important}
.mbox{border-radius:16px;background:linear-gradient(160deg,rgba(32,30,48,.82),rgba(18,17,28,.82));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 24px 60px rgba(0,0,0,.55)}
.sug{border-radius:12px;background:rgba(20,19,32,.85);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.toast{border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.msg{border-radius:12px}
.cover{background:rgba(255,255,255,.02)}
body::before{background-image:linear-gradient(rgba(166,107,255,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(111,227,255,.09) 1px,transparent 1px);background-size:48px 48px}
body::before{background-image:linear-gradient(rgba(166,107,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(111,227,255,.16) 1px,transparent 1px);background-size:48px 48px}
body::before{background-image:linear-gradient(rgba(166,107,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(111,227,255,.12) 1px,transparent 1px);background-size:48px 48px}

/* ===== Кнопки: светлое матовое стекло ===== */
.btn,.x,.tiers button,.lt{background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.26);color:#F4F2FF;backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.22);transition:background .2s,border-color .2s,transform .15s}
.btn:hover,.x:hover,.tiers button:hover,.lt:hover{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.15));border-color:rgba(255,255,255,.38);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 4px 14px rgba(0,0,0,.28)}
.btn:active,.x:active{transform:translateY(1px)}
.btn.m{background:linear-gradient(180deg,rgba(196,170,255,.42),rgba(150,110,250,.3));border:1px solid rgba(214,196,255,.5);color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.12),0 2px 10px rgba(80,40,180,.3)}
.btn.m:hover{background:linear-gradient(180deg,rgba(206,184,255,.52),rgba(160,122,252,.38));border-color:rgba(226,212,255,.65);filter:none}
.btn.g{background:linear-gradient(180deg,rgba(150,240,200,.24),rgba(94,234,176,.14));border:1px solid rgba(160,240,205,.4);color:#D9FFEE}
.btn.g:hover{background:linear-gradient(180deg,rgba(160,245,210,.32),rgba(94,234,176,.2));border-color:rgba(170,245,215,.55)}
.tiers button.on,.lt.on{background:linear-gradient(180deg,rgba(196,170,255,.4),rgba(150,110,250,.26));border-color:rgba(214,196,255,.55);color:#fff}
.btn:disabled{opacity:.45;box-shadow:none}

/* ===== Производительность: размытие только на немногих слоях ===== */
.glass,.hero,.btn,.x,.tiers button,.lt,.cover .tag,input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.glass{background:linear-gradient(160deg,rgba(28,27,40,.82),rgba(18,18,28,.82))}
.hero{background:linear-gradient(160deg,rgba(30,29,44,.82),rgba(18,18,28,.82))}
.btn,.x,.tiers button,.lt{transition:background-color .2s,border-color .2s,transform .15s}
.gig,.cat{transition:transform .2s,border-color .2s,box-shadow .2s}
.grid>.gig{content-visibility:auto;contain-intrinsic-size:auto 340px}
.cover svg{transition:none}.gig:hover .cover svg{transform:none}
body::before{will-change:auto;transform:translateZ(0)}

/* ===== Адаптив ===== */
.cbtns{flex-wrap:wrap}.cbtns .btn{flex:1 1 104px;white-space:nowrap;font-size:14px;padding:6px 10px}
.sel{min-width:0;flex-wrap:nowrap}.sel>*{min-width:0}
.gig .sel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:1500px){.grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.cats{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
@media(min-width:821px) and (max-width:1200px){.layout{grid-template-columns:220px 1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.two{grid-template-columns:1.4fr 1fr}}
@media(max-width:820px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
@media(max-width:600px){
.grid{grid-template-columns:1fr}
.pay{flex-direction:row!important}.pay .btn{flex:1}
.hero h1{font-size:44px}.hero p{font-size:16px}
.kpi{grid-template-columns:1fr 1fr}.kpi .p:first-child{grid-column:1/-1}
.mbox{padding:16px;border-radius:14px}
.row h2{font-size:18px}
table.otbl,table.wtbl{min-width:0}
.otbl tr:first-child,.wtbl tr:first-child{display:none}
.otbl,.otbl tbody,.otbl tr,.otbl td,.wtbl,.wtbl tbody,.wtbl tr,.wtbl td{display:block;width:100%}
.otbl tr,.wtbl tr{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:rgba(255,255,255,.03)}
.otbl td,.wtbl td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
.otbl td::before,.wtbl td::before{color:var(--mu);font-size:13px;text-align:left;flex:none}
.otbl td:nth-child(1)::before{content:"№"}.otbl td:nth-child(2)::before{content:"Услуга"}.otbl td:nth-child(3)::before{content:"Статус"}.otbl td:nth-child(4)::before{content:"Сумма"}
.otbl td:nth-child(5):empty,.wtbl td:nth-child(6):empty{display:none}.otbl td:nth-child(5),.wtbl td:nth-child(6){justify-content:flex-end;padding-top:8px}
.wtbl td:nth-child(1)::before{content:"Дата"}.wtbl td:nth-child(2)::before{content:"Операция"}.wtbl td:nth-child(3)::before{content:"Способ"}.wtbl td:nth-child(4)::before{content:"Монеты"}.wtbl td:nth-child(5)::before{content:"Статус"}
.otbl td[colspan]{justify-content:center}.otbl td[colspan]::before{content:none}
.stbl td:nth-child(3)::before{content:"Покупатель"}.stbl td:nth-child(4)::before{content:"Статус"}.stbl td:nth-child(5)::before{content:"Сумма"}.stbl td:nth-child(5){justify-content:space-between;padding-top:3px}
.stbl td:nth-child(6):empty{display:none}.stbl td:nth-child(6){justify-content:flex-end;padding-top:8px}
.tbl{padding:10px}
}
@media(max-width:380px){.hero h1{font-size:38px}.cats{grid-template-columns:1fr 1fr}.cat{padding:14px 12px;font-size:15px}nav a{font-size:14px}}
@media(hover:none){.gig:hover,.cat:hover{transform:none}}
@media(max-width:600px){.wtbl td,.otbl td{flex-wrap:wrap}.wtbl td br,.otbl td br{display:none}.wtbl td small,.otbl td small{flex-basis:100%;text-align:right}}
/* Телефон (класс phone на <html> ставит скрипт при загрузке): 2 компактные карточки в ряд, категории — в выпадающем окне */
html.phone .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
html.phone .grid>.gig{contain-intrinsic-size:auto 230px;border-radius:12px}
html.phone .gig .cover{height:auto;aspect-ratio:4/3}
html.phone .gig .cover .tag,html.phone .gig .top,html.phone .gig .sel,html.phone .gig .cbtns{display:none}
html.phone .gig .pad{padding:8px 9px 10px}
html.phone .gig h3{font-size:14px;line-height:1.3;height:2.6em;margin:0 0 6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
html.phone .gig .price{margin-top:0;padding-top:6px;font-size:12px;white-space:nowrap;overflow:hidden}
html.phone .gig .price b{font-size:14px}
html.phone .layout{display:block}
.fdrop{position:relative;margin-bottom:12px}
.fdbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fdbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdrop .filters{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:25;max-height:70vh;overflow:auto;background:#12151B;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.fdrop.open .filters{display:block}
.fdrop .filters label{padding:9px 0}
/* Карточки объявлений: обложка во всю ширину, цена на обложке, мягкая тень */
a.gig{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--ln2);transition:transform .25s,border-color .25s,box-shadow .25s}
a.gig:hover{transform:translateY(-4px);border-color:rgba(166,107,255,.55);box-shadow:0 18px 44px rgba(0,0,0,.45)}
a.gig .cover{height:auto;aspect-ratio:16/10;border:0;border-radius:0}
a.gig .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,16,0) 40%,rgba(8,8,16,.88));pointer-events:none}
.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
a.gig:hover .cover>img,a.gig:hover .cover>svg{transform:scale(1.06)}
a.gig .cover .tag,a.gig .top{z-index:2}
a.gig .price{position:absolute;z-index:2;left:12px;bottom:10px;right:12px;margin:0;padding:0;border:0;color:#fff;font-size:13px;display:block}
a.gig .price b{font:700 19px var(--f1);color:#fff}
a.gig .pad{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
a.gig h3{margin:0;height:auto;min-height:2.7em;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
a.gig .cbtns{margin-top:auto}
html.phone a.gig .price{left:8px;bottom:6px;font-size:11px;padding:0}
html.phone a.gig .price b{font-size:14px}
html.phone a.gig .pad{padding:8px 9px 10px}
/* Страница заказа */
.ohead{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:start}
.ohead .cover{aspect-ratio:16/10;height:auto;border-radius:14px;border:1px solid var(--ln)}
.ohead h1{font:700 clamp(20px,4.5vw,26px)/1.25 var(--f1);margin:0 0 8px}
.ometa{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mu);font-size:14px;margin:8px 0}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:12px 0}
.file{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03);display:flex;flex-direction:column}
.file .fv{aspect-ratio:4/3;background:var(--surface2);display:grid;place-items:center;font-size:34px;overflow:hidden}
.file .fv img,.file .fv video{width:100%;height:100%;object-fit:cover}
.file .fi{padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.file .fi b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.file .fi small{color:var(--mu)}
.drop{border:1.5px dashed var(--ln2);border-radius:12px;padding:18px;text-align:center;color:var(--mu);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--cy);color:var(--tx)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--cy);width:0;transition:width .2s}
.escrow{padding:10px 12px;border-radius:10px;border:1px solid rgba(88,192,138,.35);background:rgba(88,192,138,.07);font-size:14px}
.cvprev{aspect-ratio:16/10;border-radius:12px;border:1px solid var(--ln);background:var(--surface2) center/cover no-repeat;display:grid;place-items:center;color:var(--mu);font-size:14px}
@media(max-width:600px){.ohead{grid-template-columns:1fr}.files{grid-template-columns:1fr 1fr}}
/* ===== Светлая тема (класс light на <html>, выбирается в профиле) ===== */
html.light{color-scheme:light;--void:#F6F4FC;--surface:#FFFFFF;--surface2:#F0ECFA;--cy:#2A8DB8;--ma:#7C4DDB;--vi:#7C4DDB;--gr:#178A5C;--tx:#1E1B2E;--mu:#625C7A;--ln:rgba(60,40,120,.12);--ln2:rgba(60,40,120,.2);--glb:rgba(60,40,120,.14);--glb2:rgba(60,40,120,.22);--glowv:0 0 14px rgba(124,77,219,.15);--glowc:0 0 14px rgba(42,141,184,.15)}
html.light body{background:#F6F4FC;color:var(--tx)}
html.light body::before{background-image:linear-gradient(rgba(124,77,219,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(42,141,184,.05) 1px,transparent 1px)}
html.light header{background:rgba(255,255,255,.85);border-bottom:1px solid var(--ln);box-shadow:0 1px 10px rgba(60,40,120,.06)}
html.light .lg1{background-image:linear-gradient(90deg,#3B2A6E 0%,#5B3FA8 100%)}
html.light .lgo{background-image:linear-gradient(90deg,#5B3FA8 0%,#7C4DDB 100%)}
html.light .lg3{background-image:linear-gradient(90deg,#7C4DDB 0%,#9A3DFF 100%)}
html.light nav a:hover,html.light nav a.on{background:rgba(124,77,219,.1);color:var(--tx)}
html.light .glass{background:#fff;border:1px solid var(--ln);box-shadow:0 4px 18px rgba(60,40,120,.07)}
html.light .hero{background:linear-gradient(160deg,#FFFFFF,#F3EEFF);border:1px solid var(--ln2);box-shadow:0 8px 28px rgba(60,40,120,.08)}
html.light .gig:hover,html.light .cat:hover{background:#FBFAFF;border-color:rgba(124,77,219,.45);box-shadow:0 10px 26px rgba(60,40,120,.12)}
html.light a.gig{background:#fff;border:1px solid var(--ln)}
html.light a.gig:hover{box-shadow:0 14px 34px rgba(60,40,120,.15)}
html.light .cover{background:#EEEAF8;border-color:var(--ln)}
html.light .btn,html.light .x,html.light .tiers button,html.light .lt{background:linear-gradient(180deg,#FFFFFF,#F3F0FA);border:1px solid rgba(60,40,120,.18);color:var(--tx);box-shadow:0 1px 3px rgba(60,40,120,.08)}
html.light .btn:hover,html.light .x:hover,html.light .tiers button:hover,html.light .lt:hover{background:linear-gradient(180deg,#FFFFFF,#ECE6FA);border-color:rgba(124,77,219,.4);color:var(--tx);box-shadow:0 3px 10px rgba(60,40,120,.12)}
html.light .btn.m{background:linear-gradient(180deg,#9873F0,#7C4DDB);border:1px solid #7C4DDB;color:#fff;box-shadow:0 2px 10px rgba(124,77,219,.3)}
html.light .btn.m:hover{background:linear-gradient(180deg,#A584F3,#8659E0);border-color:#8659E0;color:#fff}
html.light .btn.g{background:linear-gradient(180deg,#F0FBF6,#E1F6EC);border:1px solid rgba(23,138,92,.35);color:var(--gr)}
html.light .btn.g:hover{background:#D7F2E5;border-color:rgba(23,138,92,.55)}
html.light .tiers button.on,html.light .lt.on{background:linear-gradient(180deg,#EFE8FF,#E3D8FF);border-color:rgba(124,77,219,.5);color:#4B2C9E}
html.light input[type=text],html.light input[type=number],html.light input[type=email],html.light input[type=password],html.light select,html.light textarea{background:#fff;border:1px solid rgba(60,40,120,.18);color:var(--tx)}

/* Обложка: картинка уменьшается в браузере до 1280×800 и сжимается в JPEG, чтобы загрузка была быстрой. */
let coverBlob=null;
async function upload(m,p,blob,type){const r=await fetch(p,{method:m,credentials:"same-origin",headers:{"Content-Type":type||blob.type||"application/octet-stream"},body:blob});let d=null;try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d&&typeof d.detail==="string"?d.detail:"Ошибка загрузки, попробуйте ещё раз");return d}
function shrink(file){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const k=Math.min(1,1280/i.width,800/i.height),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):bad(new Error("Не удалось обработать картинку")),"image/jpeg",.85)};i.onerror=()=>{URL.revokeObjectURL(u);bad(new Error("Это не картинка"))};i.src=u})}
async function coverPick(inp){const f=inp.files[0],box=inp.closest(".cvprev");if(!f)return;try{coverBlob=await shrink(f);box.style.backgroundImage=`url(${URL.createObjectURL(coverBlob)})`;box.firstChild.textContent=""}catch(e){coverBlob=null;toast(e.message)}}
