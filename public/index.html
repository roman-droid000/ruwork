const norm=t=>(t||"").toLowerCase().replace(/ё/g,"е");
const stem=w=>w.length>5?w.slice(0,w.length-2):w.length>4?w.slice(0,w.length-1):w;
const hay=g=>norm([g.title,g.sub,colOf(g.cat)?colOf(g.cat)[1]:"",g.desc,g.seller,(g.tags||[]).join(" "),DESC[g.title]?DESC[g.title][0]+" "+DESC[g.title][1].join(" "):""].join(" "));
const qWords=q=>norm(q).split(/[^a-zа-я0-9+#]+/i).filter(x=>x.length>1);
const wre=x=>{const a=[stem(x)];if(SYN[x])a.push(SYN[x]);return new RegExp("(^|[^a-zа-я0-9])("+a.map(v=>v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","i")};
function matchQ(g,q){const w=qWords(q);if(!w.length)return true;const h=hay(g);return w.every(x=>wre(x).test(h))}
function scoreQ(g,q){const w=qWords(q),t=norm(g.title),su=norm(g.sub);return w.reduce((s,x)=>{const r=wre(x);return s+(r.test(t)?3:0)+(r.test(su)?2:0)},0)}

/* Обложка: картинка уменьшается в браузере до 1280×800 и сжимается в JPEG, чтобы загрузка была быстрой. */
let coverBlob=null;
async function upload(m,p,blob,type){const r=await fetch(p,{method:m,credentials:"same-origin",headers:{"Content-Type":type||blob.type||"application/octet-stream"},body:blob});let d=null;try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d&&typeof d.detail==="string"?d.detail:"Ошибка загрузки, попробуйте ещё раз");return d}
function shrink(file){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const k=Math.min(1,1280/i.width,800/i.height),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):bad(new Error("Не удалось обработать картинку")),"image/jpeg",.85)};i.onerror=()=>{URL.revokeObjectURL(u);bad(new Error("Это не картинка"))};i.src=u})}
async function coverPick(inp){const f=inp.files[0],box=inp.closest(".cvprev");if(!f)return;try{coverBlob=await shrink(f);box.style.backgroundImage=`url(${URL.createObjectURL(coverBlob)})`;box.firstChild.textContent=""}catch(e){coverBlob=null;toast(e.message)}}
