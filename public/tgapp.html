<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RUWORK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A14;--card:#151325;--card2:#1D1A33;--ln:rgba(166,107,255,.18);--tx:#EEEAFB;--mu:#A39FBF;--vi:#A66BFF;--cy:#6FE3FF;--gr:#5EEAB0;--am:#FFC45C;--bl:#6AA9FF;--rd:#FF6B6B;--gy:#6E6C82;--glow:rgba(166,107,255,.22);--on:#fff;
--top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
:root[data-theme="light"]{--bg:#F4F2FB;--card:#FFFFFF;--card2:#F1EEFA;--ln:rgba(90,60,160,.14);--tx:#1B1530;--mu:#6B6585;--vi:#7C4DFF;--cy:#1C9BC4;--gr:#178A5C;--am:#B7791F;--bl:#2F6FD6;--rd:#D64545;--gy:#8C88A0;--glow:rgba(124,77,255,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:var(--top) 16px calc(28px + env(safe-area-inset-bottom))}
body:before{content:"";position:fixed;inset:-20% -20% auto;height:60vh;background:radial-gradient(60% 60% at 20% 20%,var(--glow),transparent 70%);pointer-events:none;z-index:-1}
button,input,textarea{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--vi),var(--cy));box-shadow:0 6px 20px var(--glow);flex:none}
.logo svg{width:22px;height:22px}
.top small{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.top h1{font-size:21px;font-weight:800;line-height:1.15}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--ln);display:grid;place-items:center;flex:none}
.ib svg{width:18px;height:18px}.tools{margin-left:auto;display:flex;gap:8px}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--mu);font-size:13px;transition:height .2s}
.home{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.home b{display:block;font-size:14px}.home .btn{flex:none;min-height:34px;padding:6px 12px}
.tabs{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:4px;margin-bottom:12px;position:sticky;top:var(--top);z-index:3}
.tabs button{flex:1;padding:9px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mu);transition:background .2s,color .2s;position:relative}
.tabs button.on{background:var(--card2);color:var(--tx)}
.tabs i{font-style:normal;font-size:11px;margin-left:5px;padding:1px 6px;border-radius:99px;background:var(--ln)}
.tabs i.new{background:var(--vi);color:var(--on)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search input{flex:1;padding:11px 0;outline:none;min-width:0}.search svg{width:16px;height:16px;color:var(--mu);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--ln);color:var(--mu)}
.chips button.on{background:var(--vi);border-color:var(--vi);color:var(--on)}
.list{display:grid;gap:10px}
.card{--c:var(--vi);background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;position:relative;overflow:hidden;text-align:left;width:100%;display:block}
.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c)}
.card.off{opacity:.72}
.row{display:flex;align-items:center;gap:8px}
.num{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mu);padding:3px 8px;border-radius:8px;background:var(--card2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--vi);box-shadow:0 0 0 3px color-mix(in srgb,var(--vi) 25%,transparent)}
.st{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c);padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.card h3{font-size:16px;font-weight:700;margin:10px 0 3px;line-height:1.3}
.meta{color:var(--mu);font-size:13px}.meta b{color:var(--tx);font-size:15px;font-weight:800}
.bar{display:flex;gap:5px;margin:12px 0 5px}
.bar span{flex:1;height:5px;border-radius:99px;background:var(--card2)}
.bar span.done{background:var(--gr)}.bar span.cur{background:var(--c);box-shadow:0 0 10px var(--c)}
.labels{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}.labels .cur{color:var(--tx);font-weight:700}
.timer{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--card2);font-size:13px}
.timer b{font-weight:700}.timer.late{color:var(--rd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;background:var(--card2);border:1px solid var(--ln);text-align:center;text-decoration:none}
.btn.main{background:var(--vi);border-color:var(--vi);color:var(--on)}
.btn.danger{color:var(--rd);border-color:color-mix(in srgb,var(--rd) 40%,transparent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.acts .btn:only-child,.acts .btn.full{grid-column:1/-1}
.sec{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-top:12px}
.sec h2{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h2 span{margin-left:auto;color:var(--mu);font-size:13px;font-weight:500}
.hint{font-size:13px;color:var(--mu);margin-top:10px}
.tl{list-style:none;padding:0;display:grid;gap:0}
.tl li{position:relative;padding:0 0 14px 22px;font-size:14px}
.tl li:before{content:"";position:absolute;left:4px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--gr)}
.tl li:after{content:"";position:absolute;left:8px;top:17px;bottom:-2px;width:1px;background:var(--ln)}
.tl li:last-child{padding-bottom:0}.tl li:last-child:after{display:none}
.tl small{display:block;color:var(--mu);font-size:12px}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card2);width:100%;text-align:left;margin-top:8px}
.file b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}.file small{color:var(--mu)}
.stars{display:flex;gap:6px;margin-bottom:10px}.stars button{font-size:30px;line-height:1;color:var(--gy)}.stars button.on{color:var(--am)}
textarea,.field{width:100%;background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;outline:none;resize:vertical}
textarea:focus,.field:focus{border-color:var(--vi)}
.field{margin-bottom:10px}
label.l{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
.chat{display:flex;flex-direction:column;gap:6px;padding-bottom:80px}
.msg{max-width:82%;padding:9px 12px;border-radius:16px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--ln)}
.msg small{display:block;font-size:11px;color:var(--mu);margin-top:3px;text-align:right}
.msg.me{align-self:flex-end;background:var(--vi);border-color:var(--vi);color:var(--on)}.msg.me small{color:color-mix(in srgb,var(--on) 70%,transparent)}
.msg.sys{align-self:center;max-width:92%;text-align:center;background:none;border:1px dashed var(--ln);color:var(--mu);font-size:12px}
.composer{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--ln)}
.composer textarea{min-height:42px;max-height:120px;resize:none}.composer .btn{flex:none;width:46px;padding:0}
.bal{background:linear-gradient(135deg,var(--vi),var(--cy));color:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 30px var(--glow)}
.bal small{opacity:.85;font-weight:600}.bal b{display:block;font-size:32px;font-weight:800;margin:4px 0}
.bal .acts .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff}
.op{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}.op:first-of-type{border-top:0}
.op .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--card2);flex:none;font-size:17px}
.op div{flex:1;min-width:0}.op b{display:block;font-size:14px}.op small{color:var(--mu);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .sum{flex:none;text-align:right;font-weight:700}.op .plus{color:var(--gr)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;margin-top:3px}
.tag.pending{background:color-mix(in srgb,var(--am) 18%,transparent);color:var(--am)}.tag.bad{background:color-mix(in srgb,var(--rd) 15%,transparent);color:var(--rd)}.tag.off{background:var(--card2);color:var(--mu)}
.op .x{font-size:12px;color:var(--rd);font-weight:600;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.panel small{color:var(--mu);font-size:12px;font-weight:600}.panel .big{font-size:26px;font-weight:800;margin:2px 0 12px}
.chart{display:flex;align-items:flex-end;gap:8px;height:90px;margin-bottom:6px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart span{width:100%;border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--vi) 35%,transparent);min-height:4px}
.chart div.cur span{background:linear-gradient(180deg,var(--vi),var(--cy))}
.chart em{font-style:normal;font-size:11px;color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--card2);border-radius:12px;padding:9px 10px}.kpi b{display:block;font-size:16px;font-weight:800}.kpi span{font-size:11px;color:var(--mu)}
.empty{text-align:center;padding:32px 16px;background:var(--card);border:1px dashed var(--ln);border-radius:18px}
.empty .ic{font-size:40px;margin-bottom:8px}.empty h2{font-size:18px;margin-bottom:6px}.empty p{color:var(--mu);margin-bottom:16px}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin:16px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--ln)}
.sk{height:150px;border-radius:18px;background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.sk{animation:none}.toast,.ptr{transition:none}}
</style>
</head>
<body>
<div class="ptr" id="ptr">↓ Потяните, чтобы обновить</div>
<div class="top">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-8l-5 4v-4H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/></svg></div>
  <div><small id="who">Мои заказы</small><h1 id="ttl">RUWORK</h1></div>
  <div class="tools"><button class="ib" id="homebtn" aria-label="Добавить на экран «Домой»" title="На экран «Домой»" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <button class="ib" id="full" aria-label="Во весь экран" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="ib" id="refresh" aria-label="Обновить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg></button></div>
</div>
<div id="app"><div class="list"><div class="sk"></div><div class="sk"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
const SITE = location.origin;
const STATUSES = ["Ожидает подтверждения", "В работе", "На проверке", "Спор", "Выполнен", "Отменён"];
const COLORS = {"Ожидает подтверждения": "am", "В работе": "bl", "На проверке": "vi", "Спор": "rd", "Выполнен": "gr", "Отменён": "gy"};
const STAGE = {"Ожидает подтверждения": 0, "В работе": 1, "На проверке": 2, "Спор": 2, "Выполнен": 3};
const ACTIVE = STATUSES.slice(0, 4);
const FILTERS = [["all", "Все"], ["active", "Активные"], ["review", "На проверке"], ["dispute", "Споры"], ["closed", "Завершённые"]];
const DISPUTE_RESULT = {seller: "оплата продавцу", buyer: "полный возврат покупателю", split: "сумма разделена пополам", closed: "покупатель закрыл спор"};
const OPS = {dep: ["Пополнение", "➕", 1], wd: ["Вывод", "💸", -1], pay: ["Оплата заказа", "🛒", -1], ref: ["Возврат", "↩️", 1],
             sale: ["Продажа", "💼", 1], comp: ["Компенсация за отмену", "🤝", 1], promo: ["Продвижение", "🚀", -1]};
const MONTHS = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

const S = {data: null, tab: "buy", q: {buy: "", sell: ""}, f: {buy: "all", sell: "all"}, view: "list", order: null,
           stack: [], seen: null, skew: 0, stars: 0, busy: false, homeHidden: false};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
const nf = n => Number(n).toLocaleString("ru-RU").replace(/[, ]/g, " ");
const rub = n => nf(n) + " ₽";
const now = () => Date.now() + S.skew;
const ver = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
const haptic = (k = "light") => { try { ["success", "error", "warning"].includes(k) ? tg.HapticFeedback.notificationOccurred(k) : tg.HapticFeedback.impactOccurred(k) } catch (e) {} };

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200) }
function left(ms) {
  const m = Math.max(0, Math.round(Math.abs(ms) / 60000)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return d ? `${d} д ${h} ч` : h ? `${h} ч ${mm} мин` : `${mm} мин`;
}
function when(ts) {
  const d = new Date(ts), t = d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"});
  const days = Math.floor((new Date(now()).setHours(0, 0, 0, 0) - new Date(ts).setHours(0, 0, 0, 0)) / 864e5);
  return days === 0 ? `сегодня, ${t}` : days === 1 ? `вчера, ${t}` : `${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""}, ${t}`;
}

// ---------- Telegram: подтверждение, кнопки, тема ----------

function ask(text) {
  return new Promise(res => ver("6.2") ? tg.showConfirm(text, ok => res(!!ok)) : res(confirm(text)));
}
let mainHandler = null;
function setMain(text, handler) {
  if (!ver("6.1")) return false;
  if (mainHandler) tg.MainButton.offClick(mainHandler);
  mainHandler = handler;
  tg.MainButton.setParams({text, is_visible: true, is_active: true, color: getComputedStyle(document.documentElement).getPropertyValue("--vi").trim(), text_color: "#ffffff"});
  tg.MainButton.onClick(handler);
  return true;
}
function hideMain() { if (!ver("6.1")) return; if (mainHandler) tg.MainButton.offClick(mainHandler); mainHandler = null; tg.MainButton.hide() }
function mainProgress(on) { if (ver("6.1") && mainHandler) on ? tg.MainButton.showProgress() : tg.MainButton.hideProgress() }

function theme() {
  document.documentElement.dataset.theme = tg && tg.colorScheme === "light" ? "light" : "dark";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); if (ver("7.10")) tg.setBottomBarColor(bg) } catch (e) {}
}

// ---------- Облачное хранилище: какие заказы человек уже видел ----------

function cloudGet(key) {
  return new Promise(res => {
    try { if (ver("6.9")) return tg.CloudStorage.getItem(key, (err, v) => res(err ? null : v)) } catch (e) {}
    try { res(localStorage.getItem(key)) } catch (e) { res(null) }
  });
}
function cloudSet(key, value) {
  try { if (ver("6.9")) { tg.CloudStorage.setItem(key, value); return } } catch (e) {}
  try { localStorage.setItem(key, value) } catch (e) {}
}
const isNew = o => S.seen && S.seen[o.id] !== STATUSES.indexOf(o.status);
function markSeen(orders) {
  if (!S.seen) return;
  orders.forEach(o => S.seen[o.id] = STATUSES.indexOf(o.status));
  cloudSet("seen", JSON.stringify(S.seen).slice(0, 4000));
}

// ---------- API ----------

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json", "X-Telegram-Init-Data": tg.initData},
                               body: body ? JSON.stringify(body) : undefined});
  let j = {}; try { j = await r.json() } catch (e) {}
  if (!r.ok) throw new Error(j.detail || "Что-то пошло не так, попробуйте ещё раз");
  if (j.now) S.skew = j.now - Date.now();
  return j;
}

async function load(manual) {
  if (!tg || !tg.initData) return render();
  try {
    S.data = await api("GET", "/api/tgapp/state");
    if (S.data.linked && !S.seen) {
      const raw = await cloudGet("seen");
      try { S.seen = raw ? JSON.parse(raw) : null } catch (e) { S.seen = null }
      if (!S.seen) { S.seen = {}; markSeen(S.data.orders) }  // первый запуск: всё считаем просмотренным
    }
    if (manual) { haptic("success"); toast("Обновлено") }
    if (S.view === "list" || !S.data.linked) render();
  } catch (e) {
    if (S.data) { toast(e.message); return }
    S.error = e.message; render();
  }
}

async function openOrder(id, push = true) {
  try {
    const d = await api("GET", `/api/tgapp/orders/${encodeURIComponent(id)}`);
    if (push && S.view !== "order") S.stack.push(S.view);
    S.order = d; S.view = "order"; S.stars = 0;
    markSeen([d]); render(); window.scrollTo(0, 0);
  } catch (e) { haptic("error"); toast(e.message) }
}

async function act(path, body, okText) {
  if (S.busy) return;
  S.busy = true; mainProgress(true);
  try {
    S.order = await api("POST", `/api/tgapp/orders/${encodeURIComponent(S.order.id)}/${path}`, body);
    markSeen([S.order]); haptic("success"); toast(okText);
    S.view = "order"; S.stack = ["list"]; render(); load();
  } catch (e) { haptic("error"); toast(e.message) }
  finally { S.busy = false; mainProgress(false) }
}

// ---------- Общие куски разметки ----------

function stages(o) {
  const names = ["Оплачен", "В работе", o.status === "Спор" ? "Спор" : "Проверка", "Готово"];
  if (!o.has_seller) names.splice(2, 1);
  const cur = Math.min(STAGE[o.status], names.length - 1);
  return names.map((n, i) => [n, o.status === "Выполнен" || i < cur ? "done" : i === cur ? "cur" : ""]);
}
function progress(o) {
  if (o.status === "Отменён") return "";
  const st = stages(o);
  return `<div class="bar">${st.map(([, c]) => `<span class="${c}"></span>`).join("")}</div>
    <div class="labels">${st.map(([n, c]) => `<span class="${c}">${n}</span>`).join("")}</div>`;
}
function timer(o) {
  const auto = o.auto_confirm || o.auto_at;
  if (o.status === "В работе" && o.deadline) {
    const ms = o.deadline - now();
    return ms >= 0 ? `<div class="timer">⏱ <span>Срок сдачи через <b>${left(ms)}</b></span></div>`
                   : `<div class="timer late">⚠️ <span>Срок прошёл <b>${left(ms)}</b> назад</span></div>`;
  }
  if (o.status === "На проверке" && auto) return `<div class="timer">✅ <span>Автоподтверждение через <b>${left(auto - now())}</b></span></div>`;
  return "";
}
const role = o => o.role === "buy" || o.role === "buyer" ? "buy" : "sell";
function partnerLine(o) {
  const p = o.partner || (role(o) === "buy" ? o.seller_name : o.buyer_name);
  return p ? ` · ${role(o) === "buy" ? "Продавец" : "Покупатель"}: ${esc(p)}` : "";
}

// ---------- Список ----------

function filtered(r) {
  const q = S.q[r].trim().toLowerCase(), f = S.f[r];
  return S.data.orders.filter(o => o.role === r)
    .filter(o => !q || o.num.toLowerCase().includes(q) || o.title.toLowerCase().includes(q) || (o.partner || "").toLowerCase().includes(q))
    .filter(o => f === "all" || (f === "active" && ACTIVE.includes(o.status)) || (f === "review" && o.status === "На проверке")
              || (f === "dispute" && o.status === "Спор") || (f === "closed" && !ACTIVE.includes(o.status)))
    .sort((a, b) => isNew(b) - isNew(a) || ACTIVE.includes(b.status) - ACTIVE.includes(a.status) || b.created_at - a.created_at);
}

function card(o) {
  return `<button class="card${ACTIVE.includes(o.status) ? "" : " off"}" style="--c:var(--${COLORS[o.status] || "vi"})" data-open="${esc(o.id)}">
    <div class="row">${isNew(o) ? `<span class="dot" aria-label="Обновился"></span>` : ""}<span class="num">${esc(o.num)}</span><span class="st">${esc(o.status)}</span></div>
    <h3>${esc(o.title)}</h3>
    <div class="meta"><b>${rub(o.amount)}</b>${partnerLine(o)}</div>
    ${progress(o)}<div data-timer="${esc(o.id)}">${timer(o)}</div>
    ${o.status === "Выполнен" && o.role === "buy" && o.has_seller && !o.reviewed ? `<p class="hint">⭐ Оцените работу продавца</p>` : ""}
  </button>`;
}

function sellerPanel() {
  const s = S.data.seller, max = Math.max(1, ...s.chart.map(m => m.sum)), cur = s.chart[s.chart.length - 1];
  return `<div class="panel"><small>Доход за ${MONTHS[cur.m - 1]}</small><div class="big">${rub(cur.sum)}</div>
    <div class="chart">${s.chart.map((m, i) => `<div class="${i === s.chart.length - 1 ? "cur" : ""}" title="${rub(m.sum)}"><span style="height:${Math.round(m.sum / max * 100)}%"></span><em>${MONTHS[m.m - 1]}</em></div>`).join("")}</div>
    <div class="kpis"><div class="kpi"><b>${rub(s.pending)}</b><span>в активных заказах</span></div><div class="kpi"><b>${nf(s.to_upload)}</b><span>сдать работу</span></div><div class="kpi"><b>${nf(s.review)}</b><span>на проверке</span></div></div></div>`;
}

const canAddHome = () => S.home === "missed" || S.home === "unknown";  // unknown: добавить можно, но статус неизвестен
function homeBanner() {
  return canAddHome() && !S.homeHidden ? `<div class="home"><div style="flex:1"><b>📲 На экран «Домой»</b>${S.home === "unknown" ? "Если ещё не добавили — заказы" : "Заказы"} будут открываться в одно касание, как приложение</div>
    <button class="btn main" data-act="home">Добавить</button><button class="ib" data-act="home-hide" aria-label="Скрыть">✕</button></div>` : "";
}

function listView() {
  const d = S.data, by = r => d.orders.filter(o => o.role === r), news = r => by(r).filter(isNew).length;
  const badge = r => `<i class="${news(r) ? "new" : ""}">${news(r) || by(r).length}</i>`;
  const tabs = `<div class="tabs" role="tablist">
    <button role="tab" data-tab="buy" class="${S.tab === "buy" ? "on" : ""}">Покупки${badge("buy")}</button>
    <button role="tab" data-tab="sell" class="${S.tab === "sell" ? "on" : ""}">Продажи${badge("sell")}</button>
    <button role="tab" data-tab="wallet" class="${S.tab === "wallet" ? "on" : ""}">Кошелёк</button></div>`;
  if (S.tab === "wallet") return homeBanner() + tabs + walletView();
  const r = S.tab, list = filtered(r), total = by(r).length;
  const empty = total ? `<div class="empty"><div class="ic">🔍</div><h2>Ничего не нашлось</h2><p>Измените поиск или фильтр.</p></div>`
    : `<div class="empty"><div class="ic">${r === "buy" ? "🛍" : "💼"}</div><h2>${r === "buy" ? "Покупок пока нет" : "Продаж пока нет"}</h2>
       <p>${r === "buy" ? "Найдите исполнителя в каталоге RUWORK." : "Создайте объявление — заказы появятся здесь."}</p>
       <button class="btn main" data-link="${r === "buy" ? "/#/catalog" : "/#/dashboard"}">${r === "buy" ? "Открыть каталог" : "Создать объявление"}</button></div>`;
  return homeBanner() + tabs + (r === "sell" && total ? sellerPanel() : "") + (total ? `
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Номер, название или имя" value="${esc(S.q[r])}" aria-label="Поиск по заказам"></label>
    <div class="chips">${FILTERS.map(([k, n]) => `<button data-filter="${k}" class="${S.f[r] === k ? "on" : ""}">${n}</button>`).join("")}</div>` : "") +
    `<div class="list" id="cards">${list.length ? list.map(card).join("") : empty}</div>`;
}

// ---------- Кошелёк ----------

function opRow(op) {
  const [name, ic, sign] = OPS[op.t] || [esc(op.t), "•", 1];
  const status = op.status === "pending" ? `<span class="tag pending">В обработке</span>` : op.status === "cancelled" ? `<span class="tag off">Отменена</span>`
    : op.status === "rejected" ? `<span class="tag bad">Отклонена</span>` : "";
  const muted = op.status === "cancelled" || op.status === "rejected";
  return `<div class="op"><div class="ic">${ic}</div><div><b>${name}</b><small>${esc(op.dest || when(op.ts))}</small>${op.dest ? `<small>${when(op.ts)}</small>` : ""}${status}
    ${op.status === "pending" ? `<button class="x" data-cancel-op="${esc(op.id)}">Отменить заявку</button>` : ""}</div>
    <div class="sum ${sign > 0 && !muted ? "plus" : ""}" style="${muted ? "opacity:.5;text-decoration:line-through" : ""}">${sign > 0 ? "+" : "−"}${nf(op.coins)}${op.fee ? `<small>комиссия ${nf(op.fee)}</small>` : ""}</div></div>`;
}
function walletView() {
  const w = S.data.wallet, pending = w.ops.filter(o => o.status === "pending");
  return `<div class="bal"><small>Баланс</small><b>${nf(w.coins)} монет</b><span style="opacity:.85;font-size:13px">1 монета = 1 ₽ · оплата заказов и вывод</span>
    <div class="acts"><button class="btn" data-link="/#/dashboard/wallet">➕ Пополнить</button><button class="btn" data-link="/#/dashboard/wallet">💸 Вывести</button></div></div>
    ${pending.length ? `<div class="sec"><h2>⏳ Заявки в обработке<span>${pending.length}</span></h2>${pending.map(opRow).join("")}
      <p class="hint">Заявки подтверждает администратор. Если заявка висит долго — напишите в поддержку.</p></div>` : ""}
    <div class="sec"><h2>История операций</h2>${w.ops.filter(o => o.status !== "pending").slice(0, 50).map(opRow).join("") || `<p class="hint">Операций пока нет.</p>`}</div>`;
}

// ---------- Заказ ----------

function orderHint(d) {
  const buy = role(d) === "buy";
  switch (d.status) {
    case "Ожидает подтверждения": return "Оплата получена — через минуту заказ перейдёт в работу. Сейчас отмена вернёт 100 %.";
    case "В работе": return buy ? "Продавец выполняет заказ. Отмена сейчас вернёт 90 % суммы." : "Загрузите результат на сайте — покупатель получит уведомление.";
    case "На проверке": return buy ? "Проверьте результат и подтвердите получение — или откройте спор, если что-то не так." : "Ждём подтверждения покупателя.";
    case "Спор": return "Оплата заморожена, решение примет администратор.";
    case "Выполнен": return buy ? "Заказ завершён." : "Оплата зачислена на баланс.";
    case "Отменён": return buy ? "Возврат зачислен на баланс RUWORK." : "Заказ отменён покупателем.";
  }
  return "";
}

function orderView() {
  const d = S.order, buy = role(d) === "buy", s = d.status;
  const chatN = d.chat.filter(m => m.r !== "order").length;
  const acts = [];
  if (buy && (s === "Ожидает подтверждения" || s === "В работе")) acts.push(`<button class="btn danger" data-act="cancel">Отменить заказ</button>`);
  if (buy && d.has_seller && (s === "В работе" || s === "На проверке")) acts.push(`<button class="btn danger" data-act="dispute">Открыть спор</button>`);
  if (buy && s === "Спор") acts.push(`<button class="btn" data-act="dispute-close">Закрыть спор</button>`);
  if (!buy && s === "В работе") acts.push(`<button class="btn main full" data-link="/#/order/${esc(d.id)}">Загрузить результат на сайте</button>`);
  const review = d.review ? `<div class="sec"><h2>Ваш отзыв<span>${"★".repeat(d.review.stars)}${"☆".repeat(5 - d.review.stars)}</span></h2>
      <p>${esc(d.review.text)}</p>${d.review.reply ? `<p class="hint">Ответ продавца: ${esc(d.review.reply)}</p>` : ""}</div>`
    : buy && s === "Выполнен" && d.has_seller ? `<div class="sec"><h2>⭐ Оцените работу</h2>
      <div class="stars" role="radiogroup" aria-label="Оценка">${[1, 2, 3, 4, 5].map(n => `<button data-star="${n}" class="${n <= S.stars ? "on" : ""}" aria-label="${n} из 5">★</button>`).join("")}</div>
      <textarea id="rtext" rows="3" maxlength="1000" placeholder="Что понравилось? Как прошла работа?"></textarea>
      ${ver("6.1") ? "" : `<button class="btn main wide" style="margin-top:10px" data-act="review">Отправить отзыв</button>`}</div>` : "";
  return `<div class="card" style="--c:var(--${COLORS[s] || "vi"})">
      <div class="row"><button class="num" data-copy="${esc(d.num)}" aria-label="Скопировать номер">${esc(d.num)} ⧉</button><span class="st">${esc(s)}</span></div>
      <h3>${esc(d.title)}</h3><div class="meta"><b>${rub(d.amount)}</b>${d.tier ? " · " + esc(d.tier) : ""}${partnerLine(d)}</div>
      ${progress(d)}${timer(d)}<p class="hint">${orderHint(d)}</p>
      ${acts.length ? `<div class="acts">${acts.join("")}</div>` : ""}</div>
    ${s === "Спор" || d.dispute_reason && d.dispute_result ? `<div class="sec"><h2>⚖️ Спор</h2>${d.dispute_reason ? `<p>${esc(d.dispute_reason)}</p>` : ""}
      ${d.dispute_result ? `<p class="hint">Решение: ${esc(DISPUTE_RESULT[d.dispute_result] || d.dispute_result)}</p>` : ""}</div>` : ""}
    ${review}
    ${d.files.length ? `<div class="sec"><h2>📎 Результат<span>${d.files.length}</span></h2>${d.files.map(f => `<button class="file" data-file="${esc(f.url)}"><span>📄</span><b>${esc(f.name)}</b><small>${nf(Math.max(1, Math.round(f.size / 1024)))} КБ</small></button>`).join("")}</div>` : ""}
    <div class="sec"><h2>🕓 История</h2><ul class="tl">${d.timeline.map(e => `<li>${esc(e.t)}<small>${when(e.ts)}</small></li>`).join("")}</ul></div>
    <div class="acts">
      ${d.has_seller ? `<button class="btn ${acts.length ? "" : "main"}" data-act="chat">💬 Чат${chatN ? ` · ${chatN}` : ""}</button>` : ""}
      <button class="btn" data-act="support">🛟 Поддержка</button>
      <button class="btn full" data-link="/#/order/${esc(d.id)}">Открыть на сайте</button></div>`;
}

function disputeView() {
  return `<div class="sec" style="margin-top:0"><h2>⚖️ Открыть спор</h2>
    <p class="hint" style="margin:0 0 10px">Оплата заморозится, автоподтверждение остановится. Администратор изучит переписку и результат и примет решение.</p>
    <label class="l" for="reason">Что не так с заказом?</label>
    <textarea id="reason" rows="5" maxlength="1000" placeholder="Например: продавец не выходит на связь, срок прошёл три дня назад"></textarea>
    ${ver("6.1") ? "" : `<button class="btn main wide" style="margin-top:10px" data-act="dispute-send">Открыть спор</button>`}</div>`;
}

function chatView() {
  const d = S.order, mine = role(d) === "buy" ? "me" : "seller";
  const msgs = d.chat.map(m => m.r === "order" ? `<div class="msg sys">${esc(m.t)}</div>`
    : `<div class="msg ${m.r === mine ? "me" : ""}">${esc(m.t)}<small>${when(m.ts)}</small></div>`).join("");
  return `<div class="chat" id="chat">${msgs || `<div class="empty"><div class="ic">💬</div><h2>Сообщений пока нет</h2><p>Напишите ${role(d) === "buy" ? "продавцу" : "покупателю"} — ответ придёт сюда и в уведомления.</p></div>`}</div>
    <form class="composer" id="composer"><textarea id="msg" rows="1" maxlength="1000" placeholder="Сообщение" aria-label="Сообщение"></textarea>
    <button class="btn main" aria-label="Отправить"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 20.5 21 12 3 3.5l.01 6.6L15 12 3.01 13.9z"/></svg></button></form>`;
}

// ---------- Вход ----------

function loginView() {
  return `<div class="empty" style="text-align:left"><div class="ic" style="text-align:center">🔗</div><h2 style="text-align:center">Войдите в RUWORK</h2>
    <p style="text-align:center">Telegram привяжется к аккаунту — здесь появятся заказы, а в чате бота уведомления.</p>
    <form id="login"><label class="l" for="em">Email</label><input class="field" id="em" type="email" autocomplete="email" required>
    <label class="l" for="pw">Пароль</label><input class="field" id="pw" type="password" autocomplete="current-password" required>
    <button class="btn main wide">Войти и привязать</button></form>
    <p class="hint" style="text-align:center">Пароль проверяется на сайте RUWORK и нигде не сохраняется.</p>
    <div class="or">или</div>
    <button class="btn wide" data-link="/#/dashboard/profile">Привязать через профиль на сайте</button>
    <button class="btn wide" style="margin-top:8px;border:0;background:none;color:var(--mu)" data-link="/#/dashboard">Забыли пароль?</button></div>`;
}

// ---------- Экран «Домой» ----------

function addHome() {
  try { tg.addToHomeScreen() } catch (x) { toast("Telegram не поддерживает добавление на экран «Домой» на этом устройстве"); return }
}
function homeState(st) {
  S.home = st;
  $("#homebtn").hidden = !canAddHome();
  if (S.view === "list") render();
}

// ---------- Отрисовка и навигация ----------

function render() {
  const app = $("#app"), back = S.view !== "list";
  hideMain();
  try { back ? tg.BackButton.show() : tg.BackButton.hide() } catch (e) {}
  $("#ttl").textContent = {order: "Заказ", chat: "Чат по заказу", dispute: "Спор"}[S.view] || "RUWORK";
  if (!tg || !tg.initData) {
    app.innerHTML = `<div class="empty"><div class="ic">📱</div><h2>Откройте из Telegram</h2><p>Это приложение работает внутри бота поддержки RUWORK.</p><a class="btn main" href="https://t.me/ruworksupport_bot">Перейти в бота</a></div>`;
    return;
  }
  if (!S.data) {
    app.innerHTML = S.error ? `<div class="empty"><div class="ic">⚠️</div><h2>Не получилось загрузить</h2><p>${esc(S.error)}</p><button class="btn main" data-act="retry">Повторить</button></div>` : app.innerHTML;
    return;
  }
  if (!S.data.linked) { $("#who").textContent = "Мои заказы"; app.innerHTML = loginView(); return }
  $("#who").textContent = S.data.name;
  if (S.view === "list") { app.innerHTML = listView(); return }
  if (S.view === "chat") { app.innerHTML = chatView(); window.scrollTo(0, document.body.scrollHeight); return }
  if (S.view === "dispute") { app.innerHTML = disputeView(); setMain("Открыть спор", sendDispute); return }
  app.innerHTML = orderView();
  const d = S.order, buy = role(d) === "buy";
  if (buy && d.status === "На проверке") setMain("✅ Подтвердить получение", confirmOrder);
  else if (buy && d.status === "Выполнен" && d.has_seller && !d.review) setMain("Отправить отзыв", sendReview);
}

function go(view) { S.stack.push(S.view); S.view = view; render(); if (view !== "chat") window.scrollTo(0, 0) }
function back() { S.view = S.stack.pop() || "list"; if (S.view === "list") load(); render() }

async function confirmOrder() {
  if (await ask(`Подтвердить получение по заказу ${S.order.num}? Продавец получит оплату — отменить это будет нельзя.`))
    act("confirm", null, "Заказ завершён");
}
async function sendDispute() {
  const reason = ($("#reason") || {}).value || "";
  if (reason.trim().length < 10) { haptic("error"); toast("Опишите проблему подробнее — хотя бы пару предложений"); return }
  if (await ask("Открыть спор? Оплата будет заморожена до решения администратора.")) act("dispute", {text: reason}, "Спор открыт");
}
async function sendReview() {
  const text = ($("#rtext") || {}).value || "";
  if (!S.stars) { haptic("error"); toast("Поставьте оценку от 1 до 5 звёзд"); return }
  if (text.trim().length < 5) { haptic("error"); toast("Напишите пару слов о работе"); return }
  if (S.busy) return;
  S.busy = true; mainProgress(true);
  try { S.order = await api("POST", `/api/tgapp/orders/${encodeURIComponent(S.order.id)}/review`, {stars: S.stars, text}); haptic("success"); toast("Спасибо за отзыв!"); render(); load() }
  catch (e) { haptic("error"); toast(e.message) }
  finally { S.busy = false; mainProgress(false) }
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-open],[data-act],[data-link],[data-filter],[data-star],[data-copy],[data-file],[data-cancel-op]");
  if (!t) return;
  haptic();
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return }
  if (t.dataset.open) return openOrder(t.dataset.open);
  if (t.dataset.filter) { S.f[S.tab] = t.dataset.filter; render(); return }
  if (t.dataset.link) return tg.openLink(SITE + t.dataset.link);
  if (t.dataset.file) return tg.openLink(SITE + t.dataset.file);
  if (t.dataset.star) { S.stars = +t.dataset.star; document.querySelectorAll("[data-star]").forEach(b => b.classList.toggle("on", +b.dataset.star <= S.stars)); return }
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); toast("Номер скопирован") } catch (x) { toast(t.dataset.copy) } return }
  if (t.dataset.cancelOp) {
    if (!await ask("Отменить заявку? Если это вывод, монеты вернутся на баланс.")) return;
    try { const r = await api("POST", `/api/tgapp/ops/${encodeURIComponent(t.dataset.cancelOp)}/cancel`); S.data.wallet = r.wallet; haptic("success"); toast("Заявка отменена"); render(); load() }
    catch (x) { haptic("error"); toast(x.message) }
    return;
  }
  const a = t.dataset.act;
  if (a === "retry") { S.error = null; load(true) }
  else if (a === "chat") go("chat");
  else if (a === "dispute") go("dispute");
  else if (a === "dispute-send") sendDispute();
  else if (a === "review") sendReview();
  else if (a === "support") { tg.openTelegramLink(`https://t.me/${encodeURIComponent(S.data.bot || "ruworksupport_bot")}?start=order_${encodeURIComponent(S.order.id)}`); tg.close() }
  else if (a === "cancel") {
    const refund = S.order.status === "Ожидает подтверждения" ? "100 %" : "90 %";
    if (await ask(`Отменить заказ ${S.order.num}? На баланс вернётся ${refund} суммы.`)) act("cancel", null, "Заказ отменён");
  }
  else if (a === "dispute-close") { if (await ask("Закрыть спор? Заказ вернётся к проверке результата.")) act("dispute-close", null, "Спор закрыт") }
  else if (a === "home") addHome();
  else if (a === "home-hide") { S.homeHidden = true; cloudSet("home_hidden", "1"); render() }
});

document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  S.q[S.tab] = e.target.value;
  const list = filtered(S.tab);
  $("#cards").innerHTML = list.length ? list.map(card).join("") : `<div class="empty"><div class="ic">🔍</div><h2>Ничего не нашлось</h2><p>Измените поиск или фильтр.</p></div>`;
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "login") {
    const btn = e.target.querySelector("button"); btn.disabled = true;
    try { await api("POST", "/api/tgapp/login", {email: $("#em").value, password: $("#pw").value}); haptic("success"); toast("Telegram привязан"); S.seen = null; await load() }
    catch (x) { haptic("error"); toast(x.message) }
    finally { btn.disabled = false }
  }
  if (e.target.id === "composer") {
    const box = $("#msg"), text = box.value.trim(); if (!text || S.busy) return;
    S.busy = true;
    try { const r = await api("POST", `/api/tgapp/orders/${encodeURIComponent(S.order.id)}/chat`, {text}); S.order.chat = r.chat; box.value = ""; render(); $("#msg").focus() }
    catch (x) { haptic("error"); toast(x.message) }
    finally { S.busy = false }
  }
});

// ---------- Обновление: кнопка, свайп вниз, таймеры ----------

$("#refresh").addEventListener("click", () => S.view === "list" ? load(true) : openOrder(S.order.id, false));
let pullY = null;
addEventListener("touchstart", e => { pullY = window.scrollY <= 0 && S.view === "list" ? e.touches[0].clientY : null }, {passive: true});
addEventListener("touchmove", e => {
  if (pullY === null) return;
  const dy = e.touches[0].clientY - pullY, p = $("#ptr");
  p.style.height = Math.min(48, Math.max(0, dy / 2)) + "px";
  p.textContent = dy > 90 ? "↻ Отпустите, чтобы обновить" : "↓ Потяните, чтобы обновить";
}, {passive: true});
addEventListener("touchend", e => {
  if (pullY === null) return;
  const p = $("#ptr"), ready = parseFloat(p.style.height) >= 45;
  p.style.height = "0"; pullY = null;
  if (ready) load(true);
});
setInterval(() => document.querySelectorAll("[data-timer]").forEach(el => {
  const o = S.data && S.data.orders.find(x => x.id === el.dataset.timer); if (o) el.innerHTML = timer(o);
}), 30000);
setInterval(() => {
  if (document.visibilityState !== "visible" || !S.data) return;
  if (S.view === "list") load();
  else if (S.view === "chat" && !S.busy && !$("#msg").value) api("GET", `/api/tgapp/orders/${encodeURIComponent(S.order.id)}`).then(d => {
    if (d.chat.length !== S.order.chat.length) { S.order = d; render() }
  }).catch(() => {});
}, 12000);

// ---------- Запуск ----------

if (tg) {
  tg.ready(); tg.expand(); theme();
  tg.onEvent("themeChanged", theme);
  try { tg.BackButton.onClick(back) } catch (e) {}
  if (ver("7.7")) tg.disableVerticalSwipes();  // свайп вниз обновляет список, а не закрывает приложение
  if (ver("8.0")) {
    if (["ios", "android"].includes(tg.platform)) {
      const full = $("#full"); full.hidden = false;
      full.addEventListener("click", () => tg.isFullscreen ? tg.exitFullscreen() : tg.requestFullscreen());
    }
    // Ярлык на экране «Домой»: где это невозможно (компьютер, веб), Telegram ответит unsupported
    $("#homebtn").addEventListener("click", () => { haptic(); addHome() });
    cloudGet("home_hidden").then(v => { S.homeHidden = v === "1"; tg.checkHomeScreenStatus(homeState) });
    tg.onEvent("homeScreenChecked", e => e && e.status && homeState(e.status));
    tg.onEvent("homeScreenAdded", () => { homeState("added"); haptic("success"); toast("Готово! RUWORK на экране «Домой»") });
  }
  const start = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  load().then(() => { if (start && start.startsWith("order_") && S.data && S.data.linked) openOrder(start.slice(6)) });
} else render();
</script>
</body>
</html>
